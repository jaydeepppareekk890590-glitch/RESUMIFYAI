<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nurse Medical Resume</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: white; overflow: hidden; }
.header { background: linear-gradient(135deg, #1a6b5a, #2d9b7f); padding: 28px 28px; position: relative; overflow: hidden; }
.header::after { content: ''; position: absolute; top: -50%; right: -20%; width: 300px; height: 300px; background: rgba(255,255,255,0.05); border-radius: 50%; }
.header h1 { font-size: 24px; color: white; font-weight: 700; }
.header .role { color: rgba(255,255,255,0.85); font-size: 13px; margin-top: 4px; }
.header .contact { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: rgba(255,255,255,0.7); flex-wrap: wrap; }
.body { padding: 22px 28px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }
.section { margin-bottom: 18px; }
.section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #1a6b5a; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.section h2::after { content: ''; flex: 1; height: 1px; background: #e0e8e5; }
.exp { margin-bottom: 12px; }
.exp .title { font-weight: 600; color: #222; font-size: 12px; }
.exp .meta { font-size: 10px; color: #888; margin: 2px 0; }
.exp .desc { font-size: 11px; color: #555; line-height: 1.6; }
.skill-tag { display: inline-block; padding: 4px 10px; background: #f0f8f5; border-radius: 8px; margin: 3px; font-size: 11px; color: #333; border: 1px solid #c0e0d8; }
.edu-info { font-size: 11px; color: #555; line-height: 1.8; }
.summary { font-size: 11px; color: #555; line-height: 1.7; margin-bottom: 16px; padding: 10px; background: #f7faf9; border-radius: 8px; border-left: 3px solid #1a6b5a; }
</style>
</head>
<body>
<div class="resume">
  <div class="header">
    <h1>{{NAME}}</h1>
    <p class="role">{{ROLE}}</p>
    <div class="contact"><span>📧 {{EMAIL}}</span><span>📞 {{PHONE}}</span><span>📍 {{LOCATION}}</span><span>🔗 {{LINKEDIN}}</span></div>
  </div>
  <div class="body">
    <div>
      <div class="summary">{{SUMMARY}}</div>
      <div class="section">
        <h2>Clinical Experience</h2>
        <!-- EXPERIENCE_START -->
        <div class="exp">
          <p class="title">{{EXP_TITLE}} — {{EXP_COMPANY}}</p>
          <p class="meta">{{EXP_DATE}}</p>
          <p class="desc">{{EXP_DESC}}</p>
        </div>
        <!-- EXPERIENCE_END -->
      </div>
      <div class="section">
        <h2>Education</h2>
        <!-- EDUCATION_START -->
        <div class="edu-info">{{EDU_DEGREE}} — {{EDU_SCHOOL}} ({{EDU_YEAR}})</div>
        <!-- EDUCATION_END -->
      </div>
    </div>
    <div>
      <div class="section">
        <h2>Skills</h2>
        <!-- SKILLS_START -->
        <span class="skill-tag">{{SKILL_NAME}}</span>
        <!-- SKILLS_END -->
      </div>
    </div>
  </div>
</div>
</body>
</html>
