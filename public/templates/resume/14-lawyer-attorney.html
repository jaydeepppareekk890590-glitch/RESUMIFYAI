<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lawyer Attorney Resume</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Times New Roman', serif; background: #f5f5f0; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: white; overflow: hidden; }
.header { background: #1a1a2e; padding: 28px 32px; display: flex; justify-content: space-between; align-items: flex-end; }
.header h1 { font-size: 24px; color: #c9a84c; font-weight: 400; letter-spacing: 2px; }
.header .title { color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 4px; }
.header .contact { text-align: right; font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.8; }
.gold-bar { height: 3px; background: linear-gradient(90deg, #c9a84c, #e8d491, #c9a84c); }
.body { padding: 24px 32px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 28px; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: #1a1a2e; font-weight: 700; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid #c9a84c; }
.case { margin-bottom: 14px; }
.case .name { font-weight: 700; color: #1a1a2e; font-size: 13px; }
.case .court { font-style: italic; color: #888; font-size: 10px; margin: 2px 0; }
.case .desc { color: #444; font-size: 11px; line-height: 1.7; }
.skill-tag { display: inline-block; padding: 4px 12px; border: 1px solid #e2e8f0; border-radius: 6px; margin: 3px; font-size: 11px; color: #334155; }
.summary { font-size: 11px; color: #444; line-height: 1.7; margin-bottom: 14px; padding-left: 10px; border-left: 3px solid #c9a84c; font-style: italic; }
</style>
</head>
<body>
<div class="resume">
  <div class="header">
    <div><h1>{{NAME}}</h1><p class="title">{{ROLE}}</p></div>
    <div class="contact">{{EMAIL}}<br>{{PHONE}}<br>{{LOCATION}}</div>
  </div>
  <div class="gold-bar"></div>
  <div class="body">
    <div>
      <div class="summary">{{SUMMARY}}</div>
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="case">
        <p class="name">{{EXP_TITLE}} — {{EXP_COMPANY}}</p>
        <p class="court">{{EXP_DATE}}</p>
        <p class="desc">{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
    </div>
    <div>
      <h2>Practice Areas</h2>
      <!-- SKILLS_START -->
      <span class="skill-tag">{{SKILL_NAME}}</span>
      <!-- SKILLS_END -->
      <h2 style="margin-top:20px">Education</h2>
      <!-- EDUCATION_START -->
      <div style="font-size:11px;color:#444;margin-bottom:8px">{{EDU_DEGREE}} — {{EDU_SCHOOL}} ({{EDU_YEAR}})</div>
      <!-- EDUCATION_END -->
    </div>
  </div>
</div>
</body>
</html>
