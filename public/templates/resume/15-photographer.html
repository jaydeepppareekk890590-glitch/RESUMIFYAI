<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photographer Resume</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Helvetica Neue', sans-serif; background: #111; color: #fff; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #0a0a0a; overflow: hidden; }
.hero { position: relative; padding: 40px 36px 24px; background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%); overflow: hidden; }
.hero::before { content: ''; position: absolute; top: 0; right: 0; width: 200px; height: 200px; background: conic-gradient(from 45deg, #ff006e, #8338ec, #3a86ff, #ff006e); filter: blur(80px); opacity: 0.3; }
.hero h1 { font-size: 36px; font-weight: 100; letter-spacing: 8px; position: relative; }
.hero .last { font-weight: 700; color: #ff006e; }
.hero .role { font-size: 11px; letter-spacing: 6px; color: #666; margin-top: 6px; text-transform: uppercase; }
.aperture { width: 50px; height: 50px; border: 2px solid #ff006e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px; }
.grid-section { display: grid; grid-template-columns: repeat(3,1fr); border-top: 1px solid #222; }
.grid-section > div { padding: 20px; border-right: 1px solid #222; }
.grid-section > div:last-child { border-right: none; }
h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 4px; color: #ff006e; margin-bottom: 12px; }
.exp { margin-bottom: 12px; }
.exp .t { font-size: 12px; font-weight: 600; }
.exp .m { font-size: 10px; color: #555; margin: 2px 0; }
.exp .d { font-size: 10px; color: #888; line-height: 1.6; }
.skill-tag { display: inline-block; padding: 5px 14px; border: 1px solid #333; margin: 3px; font-size: 10px; color: #888; letter-spacing: 1px; }
.contact-bar { display: flex; justify-content: center; gap: 24px; padding: 14px; border-top: 1px solid #222; font-size: 10px; color: #555; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="resume">
  <div class="hero">
    <div class="aperture">◎</div>
    <h1>{{NAME}}</h1>
    <p class="role">{{ROLE}}</p>
  </div>
  <div class="grid-section">
    <div>
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="exp">
        <p class="t">{{EXP_TITLE}} — {{EXP_COMPANY}}</p>
        <p class="m">{{EXP_DATE}}</p>
        <p class="d">{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
    </div>
    <div>
      <h2>Summary</h2>
      <p class="d" style="line-height:1.7;color:#888">{{SUMMARY}}</p>
      <h2 style="margin-top:18px">Skills</h2>
      <!-- SKILLS_START -->
      <span class="skill-tag">{{SKILL_NAME}}</span>
      <!-- SKILLS_END -->
    </div>
    <div>
      <h2>Education</h2>
      <!-- EDUCATION_START -->
      <p style="font-size:10px;color:#888;margin-bottom:6px">{{EDU_DEGREE}} — {{EDU_SCHOOL}} ({{EDU_YEAR}})</p>
      <!-- EDUCATION_END -->
    </div>
  </div>
  <div class="contact-bar"><span>{{EMAIL}}</span><span>{{LINKEDIN}}</span><span>{{LOCATION}}</span><span>{{PHONE}}</span></div>
</div>
</body>
</html>
