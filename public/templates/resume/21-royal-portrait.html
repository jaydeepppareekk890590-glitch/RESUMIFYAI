<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Portrait Resume</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;500;600&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Montserrat', sans-serif; background: #0a0a0f; color: #d4c5a9; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: linear-gradient(160deg, #0f0f18 0%, #1a1520 50%, #0f0f18 100%); border: none; position: relative; overflow: hidden; }
.resume::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, #d4c5a9, transparent); }
.header { display: flex; align-items: center; padding: 36px 44px; gap: 32px; }
.header-text h1 { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 300; color: #e8dcc8; letter-spacing: 6px; line-height: 1.1; }
.header-text h1 span { display: block; font-weight: 700; }
.divider-line { width: 60px; height: 1px; background: #d4c5a9; margin: 12px 0; }
.header-text .title { font-size: 10px; letter-spacing: 6px; text-transform: uppercase; color: rgba(212,197,169,0.6); }
.header-text .contact { margin-top: 12px; font-size: 10px; color: rgba(212,197,169,0.4); letter-spacing: 1px; }
.header-text .contact span { margin-right: 16px; }
.body { display: grid; grid-template-columns: 1fr 1px 1fr; padding: 0 44px 36px; }
.col-divider { background: linear-gradient(180deg, rgba(212,197,169,0.2), transparent); }
.col { padding: 0 22px; }
.section { margin-bottom: 26px; }
.section h2 { font-family: 'Cormorant Garamond', serif; font-size: 14px; letter-spacing: 4px; text-transform: uppercase; color: #e8dcc8; margin-bottom: 12px; position: relative; padding-bottom: 8px; }
.section h2::after { content: ''; position: absolute; bottom: 0; left: 0; width: 24px; height: 1px; background: #d4c5a9; }
.entry { margin-bottom: 12px; }
.entry h3 { font-size: 10px; font-weight: 600; color: #e8dcc8; letter-spacing: 1px; }
.entry .meta { font-size: 9px; color: rgba(212,197,169,0.4); letter-spacing: 2px; margin: 2px 0; }
.entry p { font-size: 10px; line-height: 1.7; color: rgba(212,197,169,0.6); }
.skill-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 10px; }
</style>
</head>
<body>
<div class="resume">
  <div class="header">
    <div class="header-text">
      <h1>{{NAME}}</h1>
      <div class="divider-line"></div>
      <div class="title">{{ROLE}}</div>
      <div class="contact">
        <span>{{EMAIL}}</span>
        <span>{{PHONE}}</span>
        <span>{{LOCATION}}</span>
        <span>{{LINKEDIN}}</span>
      </div>
    </div>
  </div>
  <div class="body">
    <div class="col">
      <div class="section">
        <h2>Experience</h2>
        <!-- EXPERIENCE_START -->
        <div class="entry">
          <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
          <div class="meta">{{EXP_DATE}}</div>
          <p>{{EXP_DESC}}</p>
        </div>
        <!-- EXPERIENCE_END -->
      </div>
      <div class="section">
        <h2>Summary</h2>
        <p style="font-size:10px;color:rgba(212,197,169,0.6);line-height:1.7">{{SUMMARY}}</p>
      </div>
    </div>
    <div class="col-divider"></div>
    <div class="col">
      <div class="section">
        <h2>Expertise</h2>
        <!-- SKILLS_START -->
        <div class="skill-row"><span>{{SKILL_NAME}}</span></div>
        <!-- SKILLS_END -->
      </div>
      <div class="section">
        <h2>Education</h2>
        <!-- EDUCATION_START -->
        <div class="entry">
          <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
          <div class="meta">{{EDU_YEAR}}</div>
        </div>
        <!-- EDUCATION_END -->
      </div>
    </div>
  </div>
</div>
</body>
</html>
