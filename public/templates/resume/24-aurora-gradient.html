<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Gradient Resume</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Space Grotesk', sans-serif; background: #080810; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #0c0c18; border-radius: 0; overflow: hidden; position: relative; }
.aurora { height: 140px; background: linear-gradient(135deg, #0f3460, #16213e, #533483, #e94560, #0f3460); background-size: 400% 400%; position: relative; display: flex; align-items: flex-end; padding: 20px 36px; }
.aurora .profile { display: flex; align-items: flex-end; gap: 20px; position: relative; z-index: 2; }
.profile-text { padding-bottom: 8px; color: #fff; }
.profile-text h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
.profile-text .role { font-size: 12px; font-weight: 300; color: rgba(255,255,255,0.6); margin-top: 2px; }
.content { padding: 30px 36px 20px; color: #ccc; }
.meta-row { display: flex; gap: 20px; margin-bottom: 18px; font-size: 11px; color: rgba(255,255,255,0.4); flex-wrap: wrap; }
.sections { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; }
h2 { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 12px; font-weight: 500; }
.exp { margin-bottom: 14px; padding: 12px; background: rgba(255,255,255,0.02); border-radius: 8px; border-left: 3px solid #e94560; }
.exp h3 { font-size: 12px; color: #fff; font-weight: 600; }
.exp .meta { font-size: 10px; color: #e94560; margin: 2px 0 5px; letter-spacing: 1px; }
.exp p { font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.6; }
.tag-cloud { display: flex; flex-wrap: wrap; gap: 5px; }
.tag-cloud span { padding: 5px 12px; border-radius: 20px; font-size: 10px; background: rgba(233,69,96,0.1); color: #e94560; border: 1px solid rgba(233,69,96,0.2); }
.edu-item { margin-bottom: 10px; font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.7; }
</style>
</head>
<body>
<div class="resume">
  <div class="aurora">
    <div class="profile">
      <div class="profile-text">
        <h1>{{NAME}}</h1>
        <div class="role">{{ROLE}}</div>
      </div>
    </div>
  </div>
  <div class="content">
    <div class="meta-row">
      <span>{{EMAIL}}</span>
      <span>{{LOCATION}}</span>
      <span>{{PHONE}}</span>
      <span>{{LINKEDIN}}</span>
    </div>
    <p style="font-size:11px;color:rgba(255,255,255,0.5);line-height:1.7;margin-bottom:16px">{{SUMMARY}}</p>
    <div class="sections">
      <div>
        <h2>Experience</h2>
        <!-- EXPERIENCE_START -->
        <div class="exp">
          <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
          <div class="meta">{{EXP_DATE}}</div>
          <p>{{EXP_DESC}}</p>
        </div>
        <!-- EXPERIENCE_END -->
      </div>
      <div>
        <h2>Technologies</h2>
        <div class="tag-cloud">
          <!-- SKILLS_START -->
          <span>{{SKILL_NAME}}</span>
          <!-- SKILLS_END -->
        </div>
        <h2 style="margin-top:20px">Education</h2>
        <!-- EDUCATION_START -->
        <div class="edu-item">{{EDU_DEGREE}} — {{EDU_SCHOOL}} ({{EDU_YEAR}})</div>
        <!-- EDUCATION_END -->
      </div>
    </div>
  </div>
</div>
</body>
</html>
