<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magazine Spread Resume</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'DM Sans', sans-serif; background: #f0ede8; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #fff; display: grid; grid-template-columns: 280px 1fr; overflow: hidden; }
.left { background: #1c1c1c; color: #fff; padding: 32px 28px; display: flex; flex-direction: column; overflow: hidden; }
.left h1 { font-family: 'DM Serif Display', serif; font-size: 30px; line-height: 1.15; margin-bottom: 6px; }
.left .subtitle { font-size: 10px; color: #b08d57; letter-spacing: 4px; text-transform: uppercase; margin: 6px 0 20px; }
.left-block { margin-bottom: 20px; }
.left-block h3 { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: #b08d57; margin-bottom: 8px; }
.left-block p { font-size: 11px; color: #aaa; line-height: 1.7; }
.contact-line { font-size: 11px; color: #888; margin-bottom: 5px; }
.right { padding: 32px; display: flex; flex-direction: column; justify-content: flex-start; overflow: hidden; }
.right h2 { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: #b08d57; margin-bottom: 12px; font-weight: 700; }
.right-section { margin-bottom: 22px; }
.timeline-entry { display: flex; gap: 12px; margin-bottom: 12px; }
.timeline-year { font-size: 11px; font-weight: 600; color: #b08d57; min-width: 40px; padding-top: 2px; }
.timeline-content h4 { font-size: 12px; font-weight: 600; color: #1c1c1c; }
.timeline-content .place { font-size: 10px; color: #999; margin: 2px 0 4px; }
.timeline-content p { font-size: 11px; color: #666; line-height: 1.6; }
.expertise-item { font-size: 10px; color: #444; padding: 7px 10px; background: #f8f6f3; border-left: 2px solid #b08d57; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="resume">
  <div class="left">
    <h1>{{NAME}}</h1>
    <div class="subtitle">{{ROLE}}</div>
    <div class="left-block">
      <h3>About</h3>
      <p>{{SUMMARY}}</p>
    </div>
    <div class="left-block">
      <h3>Contact</h3>
      <div class="contact-line">{{EMAIL}}</div>
      <div class="contact-line">{{PHONE}}</div>
      <div class="contact-line">{{LOCATION}}</div>
      <div class="contact-line">{{LINKEDIN}}</div>
    </div>
    <div class="left-block">
      <h3>Education</h3>
      <!-- EDUCATION_START -->
      <p style="font-size:11px;color:#aaa;margin-bottom:5px">{{EDU_DEGREE}} — {{EDU_SCHOOL}} ({{EDU_YEAR}})</p>
      <!-- EDUCATION_END -->
    </div>
  </div>
  <div class="right">
    <div class="right-section">
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="timeline-entry">
        <div class="timeline-year">{{EXP_DATE}}</div>
        <div class="timeline-content">
          <h4>{{EXP_TITLE}} — {{EXP_COMPANY}}</h4>
          <p>{{EXP_DESC}}</p>
        </div>
      </div>
      <!-- EXPERIENCE_END -->
    </div>
    <div class="right-section">
      <h2>Expertise</h2>
      <!-- SKILLS_START -->
      <div class="expertise-item">{{SKILL_NAME}}</div>
      <!-- SKILLS_END -->
    </div>
  </div>
</div>
</body>
</html>
