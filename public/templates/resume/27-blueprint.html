<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint Resume</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Archivo', sans-serif; background: #1a2940; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #1e3150; border: none; padding: 32px 36px; position: relative; color: #a8c8e8; background-image: linear-gradient(rgba(100,160,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(100,160,255,0.03) 1px, transparent 1px); background-size: 20px 20px; overflow: hidden; }
.corner { position: absolute; width: 16px; height: 16px; border-color: rgba(100,160,255,0.3); border-style: solid; }
.corner.tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
.corner.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
.corner.bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
.corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }
.header { display: flex; align-items: center; gap: 24px; margin-bottom: 22px; }
.header-info h1 { font-size: 34px; font-weight: 900; color: #fff; letter-spacing: -1px; text-transform: uppercase; }
.header-info .role { font-size: 11px; letter-spacing: 6px; text-transform: uppercase; color: rgba(100,160,255,0.6); margin-top: 4px; }
.header-info .coords { font-size: 10px; color: rgba(100,160,255,0.3); margin-top: 6px; font-family: monospace; }
.content { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
h2 { font-size: 10px; letter-spacing: 5px; text-transform: uppercase; color: #64a0ff; margin-bottom: 12px; font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid rgba(100,160,255,0.1); }
.entry { margin-bottom: 14px; padding-left: 12px; border-left: 2px solid rgba(100,160,255,0.15); }
.entry h3 { font-size: 12px; color: #fff; font-weight: 600; }
.entry .meta { font-size: 9px; color: #64a0ff; letter-spacing: 2px; margin: 2px 0 4px; }
.entry p { font-size: 10px; line-height: 1.7; color: rgba(168,200,232,0.6); }
.tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.tag-row span { padding: 4px 10px; font-size: 9px; border: 1px solid rgba(100,160,255,0.2); color: #64a0ff; letter-spacing: 1px; }
.ref-line { font-size: 10px; color: rgba(100,160,255,0.4); margin-bottom: 5px; }
.summary-line { font-size: 11px; color: rgba(168,200,232,0.6); line-height: 1.7; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="resume">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="header">
    <div class="header-info">
      <h1>{{NAME}}</h1>
      <div class="role">{{ROLE}}</div>
      <div class="coords">{{EMAIL}} · {{PHONE}} · {{LOCATION}}</div>
    </div>
  </div>
  <div class="summary-line">{{SUMMARY}}</div>
  <div class="content">
    <div>
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
    </div>
    <div>
      <h2>Technical Skills</h2>
      <div class="tag-row">
        <!-- SKILLS_START -->
        <span>{{SKILL_NAME}}</span>
        <!-- SKILLS_END -->
      </div>
      <h2>Education</h2>
      <!-- EDUCATION_START -->
      <div class="entry">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <div class="meta">{{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
      <h2 style="margin-top:14px">Contact</h2>
      <div class="ref-line">{{EMAIL}}</div>
      <div class="ref-line">{{PHONE}}</div>
      <div class="ref-line">{{LINKEDIN}}</div>
    </div>
  </div>
</div>
</body>
</html>
