<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vogue Editorial Resume</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Karla:wght@300;400;500;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Karla', sans-serif; background: #f7f4ef; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #fff; overflow: hidden; }
.hero { display: grid; grid-template-columns: 1fr 1fr; height: 220px; }
.hero-photo { background: #e8e2d8; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #bbb; letter-spacing: 3px; }
.hero-text { padding: 30px; display: flex; flex-direction: column; justify-content: center; background: #fff; }
.hero-text .issue { font-size: 9px; letter-spacing: 6px; text-transform: uppercase; color: #c8a87c; margin-bottom: 10px; }
.hero-text h1 { font-family: 'Libre Baskerville', serif; font-size: 34px; line-height: 1.15; color: #1a1a1a; }
.hero-text .dash { width: 32px; height: 2px; background: #c8a87c; margin: 10px 0; }
.hero-text .role { font-size: 11px; color: #888; letter-spacing: 2px; }
.hero-text .bio { font-size: 11px; color: #666; line-height: 1.7; margin-top: 10px; }
.body-content { padding: 24px 32px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
.col h2 { font-family: 'Libre Baskerville', serif; font-size: 12px; color: #1a1a1a; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid #e8e2d8; }
.exp-item { margin-bottom: 12px; }
.exp-item h3 { font-size: 11px; font-weight: 600; color: #1a1a1a; }
.exp-item .meta { font-size: 10px; color: #c8a87c; letter-spacing: 1px; margin: 2px 0 4px; }
.exp-item p { font-size: 10px; color: #888; line-height: 1.6; }
.skill-tag { display: inline-block; padding: 4px 10px; border: 1px solid #e8e2d8; font-size: 10px; color: #888; margin: 3px 3px 3px 0; }
.contact-block { background: #faf8f4; padding: 12px; margin-top: 8px; font-size: 10px; color: #888; line-height: 1.8; }
</style>
</head>
<body>
<div class="resume">
  <div class="hero">
    <div class="hero-photo">PHOTO</div>
    <div class="hero-text">
      <div class="issue">Curriculum Vitae · 2024</div>
      <h1>{{NAME}}</h1>
      <div class="dash"></div>
      <div class="role">{{ROLE}}</div>
      <div class="bio">{{SUMMARY}}</div>
    </div>
  </div>
  <div class="body-content">
    <div class="col">
      <h2>Career</h2>
      <!-- EXPERIENCE_START -->
      <div class="exp-item">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
    </div>
    <div class="col">
      <h2>Expertise</h2>
      <!-- SKILLS_START -->
      <span class="skill-tag">{{SKILL_NAME}}</span>
      <!-- SKILLS_END -->
    </div>
    <div class="col">
      <h2>Education</h2>
      <!-- EDUCATION_START -->
      <div class="exp-item">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <div class="meta">{{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
      <div class="contact-block">{{EMAIL}}<br>{{PHONE}}<br>{{LOCATION}}<br>{{LINKEDIN}}</div>
    </div>
  </div>
</div>
</body>
</html>
