<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passport Style Resume</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Inter', sans-serif; background: #2c3e50; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #1a2634; overflow: hidden; border: 2px solid #2c4a6e; }
.passport-top { background: linear-gradient(135deg, #1e3a5f, #2c5282); padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #d4a853; }
.passport-top .emblem { font-size: 9px; letter-spacing: 6px; color: #d4a853; text-transform: uppercase; }
.passport-top .type { font-family: 'Source Code Pro', monospace; font-size: 10px; color: rgba(255,255,255,0.3); }
.id-section { display: flex; padding: 22px 28px; gap: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.photo { width: 100px; height: 120px; background: #0f1a2a; border: 2px solid #2c4a6e; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #2c4a6e; flex-shrink: 0; }
.id-info { flex: 1; color: #ccd6e0; }
.id-info h1 { font-size: 26px; color: #fff; font-weight: 700; letter-spacing: 2px; margin-bottom: 14px; }
.id-grid { display: grid; grid-template-columns: 80px 1fr; gap: 6px; font-size: 10px; }
.id-grid .label { color: rgba(255,255,255,0.3); font-size: 8px; text-transform: uppercase; letter-spacing: 2px; }
.id-grid .value { color: #e8dcc8; font-weight: 500; }
.stamps { padding: 16px 28px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stamp { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 6px; padding: 14px; }
.stamp .city { font-size: 9px; letter-spacing: 3px; color: #d4a853; text-transform: uppercase; margin-bottom: 6px; }
.stamp h3 { font-size: 11px; color: #fff; font-weight: 600; }
.stamp .org { font-size: 10px; color: rgba(255,255,255,0.4); margin: 2px 0 5px; }
.stamp p { font-size: 10px; color: rgba(255,255,255,0.5); line-height: 1.6; }
.stamp .dates { font-family: 'Source Code Pro', monospace; font-size: 9px; color: rgba(212,168,83,0.5); margin-top: 6px; }
.mrz { background: #0a1220; padding: 10px 28px; font-family: 'Source Code Pro', monospace; font-size: 9px; color: rgba(255,255,255,0.15); letter-spacing: 2px; line-height: 1.6; border-top: 1px solid rgba(255,255,255,0.05); }
.skills-bar { padding: 12px 28px; display: flex; flex-wrap: wrap; gap: 6px; }
.skills-bar span { padding: 4px 12px; font-size: 9px; border: 1px solid #2c4a6e; color: #5a8dbe; border-radius: 3px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="resume">
  <div class="passport-top">
    <div class="emblem">Professional Passport · Curriculum Vitae</div>
    <div class="type">DOC No. CV-2024</div>
  </div>
  <div class="id-section">
    <div class="photo">PHOTO</div>
    <div class="id-info">
      <h1>{{NAME}}</h1>
      <div class="id-grid">
        <span class="label">Title</span><span class="value">{{ROLE}}</span>
        <span class="label">Based In</span><span class="value">{{LOCATION}}</span>
        <span class="label">Email</span><span class="value">{{EMAIL}}</span>
        <span class="label">Phone</span><span class="value">{{PHONE}}</span>
        <span class="label">LinkedIn</span><span class="value">{{LINKEDIN}}</span>
      </div>
    </div>
  </div>
  <p style="padding:12px 28px;font-size:10px;color:rgba(255,255,255,0.5);line-height:1.7">{{SUMMARY}}</p>
  <div class="stamps">
    <!-- EXPERIENCE_START -->
    <div class="stamp">
      <div class="city">{{EXP_COMPANY}}</div>
      <h3>{{EXP_TITLE}}</h3>
      <p>{{EXP_DESC}}</p>
      <div class="dates">{{EXP_DATE}}</div>
    </div>
    <!-- EXPERIENCE_END -->
  </div>
  <div class="skills-bar">
    <!-- SKILLS_START -->
    <span>{{SKILL_NAME}}</span>
    <!-- SKILLS_END -->
  </div>
  <div class="mrz">
    <!-- EDUCATION_START -->
    {{EDU_DEGREE}} · {{EDU_SCHOOL}} · {{EDU_YEAR}}
    <!-- EDUCATION_END -->
  </div>
</div>
</body>
</html>
