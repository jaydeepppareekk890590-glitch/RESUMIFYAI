<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brutalist Bold Resume</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;500;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Roboto', sans-serif; background: #e8e4df; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #fff; border: 4px solid #000; overflow: hidden; }
.header { display: grid; grid-template-columns: 160px 1fr; border-bottom: 4px solid #000; }
.photo-box { background: #000; display: flex; align-items: center; justify-content: center; min-height: 180px; }
.photo { width: 120px; height: 150px; background: #1a1a1a; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #555; letter-spacing: 3px; }
.name-box { padding: 20px 24px; display: flex; flex-direction: column; justify-content: center; }
.name-box h1 { font-family: 'Bebas Neue', sans-serif; font-size: 54px; line-height: 0.9; color: #000; letter-spacing: 3px; }
.name-box .role { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 5px; color: #ff0000; margin-top: 8px; }
.name-box .contact { font-size: 10px; color: #666; margin-top: 12px; line-height: 1.8; }
.ticker { background: #ff0000; padding: 6px 20px; font-family: 'Bebas Neue', sans-serif; font-size: 13px; color: #fff; letter-spacing: 4px; border-bottom: 4px solid #000; text-align: center; }
.content { display: grid; grid-template-columns: 1fr 1fr; }
.col { padding: 20px 22px; }
.col:first-child { border-right: 4px solid #000; }
h2 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 3px; color: #000; margin-bottom: 12px; padding-bottom: 4px; border-bottom: 2px solid #000; }
.entry { margin-bottom: 14px; }
.entry h3 { font-size: 11px; font-weight: 900; text-transform: uppercase; color: #000; }
.entry .meta { font-size: 10px; color: #ff0000; font-weight: 700; letter-spacing: 1px; margin: 2px 0 4px; }
.entry p { font-size: 10px; color: #666; line-height: 1.6; }
.brutal-skills { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.brutal-skills span { padding: 6px; background: #000; color: #fff; font-size: 10px; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
.brutal-skills span:nth-child(even) { background: #ff0000; }
</style>
</head>
<body>
<div class="resume">
  <div class="header">
    <div class="photo-box"><div class="photo">PHOTO</div></div>
    <div class="name-box">
      <h1>{{NAME}}</h1>
      <div class="role">{{ROLE}}</div>
      <div class="contact">{{EMAIL}}<br>{{PHONE}}<br>{{LOCATION}} · {{LINKEDIN}}</div>
    </div>
  </div>
  <div class="ticker">{{SUMMARY}}</div>
  <div class="content">
    <div class="col">
      <h2>Career</h2>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
    </div>
    <div class="col">
      <h2>Skills</h2>
      <div class="brutal-skills">
        <!-- SKILLS_START -->
        <span>{{SKILL_NAME}}</span>
        <!-- SKILLS_END -->
      </div>
      <h2 style="margin-top:14px">Education</h2>
      <!-- EDUCATION_START -->
      <div class="entry">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <div class="meta">{{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
    </div>
  </div>
</div>
</body>
</html>
