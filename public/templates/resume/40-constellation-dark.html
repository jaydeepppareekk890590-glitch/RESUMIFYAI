<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation Dark Resume</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Manrope', sans-serif; background: #06060f; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #0a0a18; position: relative; overflow: hidden; }
.stars { position: absolute; inset: 0; background: radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.3), transparent), radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.2), transparent), radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.3), transparent), radial-gradient(1px 1px at 60% 50%, rgba(255,255,255,0.15), transparent), radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.2), transparent); z-index: 0; }
.content-wrap { position: relative; z-index: 1; }
.header { padding: 28px 36px; display: flex; align-items: center; gap: 24px; }
.header-text h1 { font-family: 'Spectral', serif; font-size: 34px; color: #e8e0f0; font-weight: 500; letter-spacing: 2px; }
.header-text .role { font-size: 10px; color: rgba(140,100,220,0.7); letter-spacing: 5px; text-transform: uppercase; margin-top: 4px; }
.header-text .tagline { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 8px; line-height: 1.7; max-width: 420px; }
.header-text .contact { font-size: 10px; color: rgba(255,255,255,0.2); margin-top: 8px; }
.constellation-line { height: 1px; background: linear-gradient(90deg, transparent, rgba(100,60,180,0.3), transparent); margin: 0 36px; }
.body { padding: 24px 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
h2 { font-family: 'Spectral', serif; font-size: 14px; color: rgba(140,100,220,0.8); margin-bottom: 12px; font-weight: 400; letter-spacing: 2px; }
.entry { margin-bottom: 14px; position: relative; padding-left: 16px; }
.entry::before { content: '✦'; position: absolute; left: 0; top: 0; color: rgba(140,100,220,0.4); font-size: 8px; }
.entry h3 { font-size: 11px; color: #e8e0f0; font-weight: 600; }
.entry .meta { font-size: 9px; color: rgba(140,100,220,0.5); letter-spacing: 2px; margin: 3px 0 5px; }
.entry p { font-size: 10px; color: rgba(255,255,255,0.35); line-height: 1.7; }
.orbit-skills { display: flex; flex-wrap: wrap; gap: 6px; }
.orbit-skills span { padding: 5px 14px; border-radius: 20px; font-size: 9px; border: 1px solid rgba(100,60,180,0.2); color: rgba(140,100,220,0.7); letter-spacing: 1px; background: rgba(100,60,180,0.05); }
</style>
</head>
<body>
<div class="resume">
  <div class="stars"></div>
  <div class="content-wrap">
    <div class="header">
      <div class="header-text">
        <h1>{{NAME}}</h1>
        <div class="role">{{ROLE}}</div>
        <div class="tagline">{{SUMMARY}}</div>
        <div class="contact">{{EMAIL}} · {{PHONE}} · {{LOCATION}} · {{LINKEDIN}}</div>
      </div>
    </div>
    <div class="constellation-line"></div>
    <div class="body">
      <div>
        <h2>Mission History</h2>
        <!-- EXPERIENCE_START -->
        <div class="entry">
          <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
          <div class="meta">{{EXP_DATE}}</div>
          <p>{{EXP_DESC}}</p>
        </div>
        <!-- EXPERIENCE_END -->
        <h2>Education</h2>
        <!-- EDUCATION_START -->
        <div class="entry">
          <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
          <div class="meta">{{EDU_YEAR}}</div>
        </div>
        <!-- EDUCATION_END -->
      </div>
      <div>
        <h2>Domains</h2>
        <div class="orbit-skills">
          <!-- SKILLS_START -->
          <span>{{SKILL_NAME}}</span>
          <!-- SKILLS_END -->
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
