<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psychedelic Wave Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2, #f093fb); margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: rgba(255,255,255,.96); overflow: hidden; }
.header { padding: 24px; background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #f5576c, #fda085); color: #fff; text-align: center; }
h1 { font-family: 'Righteous', cursive; font-size: 32px; text-shadow: 2px 4px 10px rgba(0,0,0,0.2); }
.subtitle { font-size: 12px; opacity: 0.9; margin-top: 3px; }
.contact-row { display: flex; justify-content: center; gap: 14px; margin-top: 8px; font-size: 11px; opacity: 0.85; flex-wrap: wrap; }
.body { padding: 20px 28px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.section h2 { font-family: 'Righteous', cursive; font-size: 18px; background: linear-gradient(135deg, #667eea, #f093fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
.entry { padding: 10px 14px; border-left: 4px solid; margin-bottom: 9px; border-radius: 0 6px 6px 0; background: #f8f7ff; }
.entry:nth-child(odd) { border-color: #667eea; }
.entry:nth-child(even) { border-color: #f093fb; }
.entry h3 { font-size: 12px; font-weight: 700; color: #333; }
.entry .meta { font-size: 10px; color: #999; margin: 2px 0; }
.entry p { font-size: 11px; color: #666; line-height: 1.5; }
.skill-waves { display: flex; flex-wrap: wrap; gap: 7px; }
.skill-wave { padding: 6px 14px; border-radius: 24px; font-size: 11px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #667eea, #764ba2); }
.skill-wave:nth-child(even) { background: linear-gradient(135deg, #f093fb, #f5576c); }
.skill-wave:nth-child(3n) { background: linear-gradient(135deg, #fda085, #f5576c); }
.full-width { grid-column: 1 / -1; }
.summary { font-size: 11px; color: #666; line-height: 1.7; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="resume">
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="subtitle">{{ROLE}}</div>
    <div class="contact-row">
      <span>📧 {{EMAIL}}</span><span>📱 {{PHONE}}</span><span>📍 {{LOCATION}}</span><span>🌐 {{LINKEDIN}}</span>
    </div>
  </div>
  <div class="body">
    <div class="section">
      <p class="summary">{{SUMMARY}}</p>
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
    </div>
    <div class="section">
      <h2>Education</h2>
      <!-- EDUCATION_START -->
      <div class="entry">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <div class="meta">{{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
    </div>
    <div class="section full-width">
      <h2>Skills</h2>
      <div class="skill-waves">
        <!-- SKILLS_START -->
        <span class="skill-wave">{{SKILL_NAME}}</span>
        <!-- SKILLS_END -->
      </div>
    </div>
  </div>
</div>
</body>
</html>
