<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticker Bomb Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Open Sans', sans-serif; background: #fafafa; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #fff; padding: 20px; overflow: hidden; }
.header { display: flex; align-items: center; gap: 20px; margin-bottom: 14px; padding: 16px; background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3); border-radius: 16px; position: relative; }
h1 { font-family: 'Baloo 2', cursive; font-size: 30px; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
.role { font-size: 12px; color: rgba(255,255,255,0.9); font-weight: 600; margin-top: 3px; }
.contact { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.contact span { padding: 3px 10px; background: rgba(255,255,255,0.3); border-radius: 20px; font-size: 10px; color: #fff; }
.sections { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.sticker-box { background: #fff; border: 3px solid #222; border-radius: 14px; padding: 14px; box-shadow: 4px 4px 0 #222; }
.sticker-box h2 { font-family: 'Baloo 2', cursive; font-size: 16px; margin-bottom: 10px; }
.entry { margin-bottom: 9px; padding: 8px; border-radius: 8px; background: #f8f8f8; border: 2px solid #eee; }
.entry h3 { font-size: 11px; font-weight: 700; color: #333; }
.entry .meta { font-size: 10px; color: #999; margin: 2px 0; }
.entry p { font-size: 10px; color: #666; line-height: 1.5; }
.sticker-tag { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 10px; font-weight: 700; margin: 3px; border: 2px solid #222; background: #feca57; }
.sticker-tag:nth-child(2n) { background: #ff6b6b; color: #fff; }
.sticker-tag:nth-child(3n) { background: #48dbfb; }
.sticker-tag:nth-child(4n) { background: #ff9ff3; }
.full-width { grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="resume">
  <div class="header">
    <div>
      <h1>{{NAME}}</h1>
      <div class="role">{{ROLE}}</div>
      <div class="contact">
        <span>📧 {{EMAIL}}</span><span>📱 {{PHONE}}</span><span>📍 {{LOCATION}}</span><span>🌐 {{LINKEDIN}}</span>
      </div>
    </div>
  </div>
  <p style="font-size:11px;color:#666;line-height:1.7;margin-bottom:12px">{{SUMMARY}}</p>
  <div class="sections">
    <div class="sticker-box">
      <h2>💼 Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
    </div>
    <div class="sticker-box">
      <h2>🎓 Education</h2>
      <!-- EDUCATION_START -->
      <div class="entry">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <div class="meta">{{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
    </div>
    <div class="sticker-box full-width">
      <h2>⚡ Skills</h2>
      <!-- SKILLS_START -->
      <span class="sticker-tag">{{SKILL_NAME}}</span>
      <!-- SKILLS_END -->
    </div>
  </div>
</div>
</body>
</html>
