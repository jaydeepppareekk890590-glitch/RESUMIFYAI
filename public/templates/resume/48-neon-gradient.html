<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Gradient Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Exo 2', sans-serif; background: #060010; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: linear-gradient(160deg, #0d0025, #050015); overflow: hidden; position: relative; }
.neon-line { height: 3px; background: linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff); margin-bottom: 0; }
.header { padding: 22px 32px; position: relative; }
.header h1 { font-family: 'Rajdhani', sans-serif; font-size: 38px; font-weight: 700; background: linear-gradient(90deg, #ff00ff, #00ffff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 3px; }
.header .role { font-size: 11px; color: rgba(0,255,255,0.5); letter-spacing: 4px; text-transform: uppercase; margin-top: 4px; }
.header .contact { display: flex; gap: 14px; margin-top: 10px; font-size: 10px; color: rgba(255,0,255,0.5); flex-wrap: wrap; }
.content { display: grid; grid-template-columns: 1.3fr 1fr; padding: 0 32px; gap: 24px; }
h2 { font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: #ff00ff; margin-bottom: 12px; border-bottom: 1px solid rgba(255,0,255,0.1); padding-bottom: 5px; }
.entry { margin-bottom: 13px; padding-left: 12px; border-left: 2px solid rgba(255,0,255,0.2); }
.entry h3 { font-size: 11px; color: rgba(255,255,255,0.9); font-weight: 600; }
.entry .meta { font-size: 9px; color: #ff00ff; letter-spacing: 2px; margin: 2px 0; }
.entry p { font-size: 10px; color: rgba(255,255,255,0.4); line-height: 1.7; }
.skill-neon { display: flex; flex-wrap: wrap; gap: 5px; }
.skill-neon span { padding: 4px 12px; font-size: 9px; border: 1px solid rgba(0,255,255,0.2); color: #00ffff; letter-spacing: 1px; border-radius: 2px; }
.summary { font-size: 10px; color: rgba(255,255,255,0.4); line-height: 1.7; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="resume">
  <div class="neon-line"></div>
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="role">{{ROLE}}</div>
    <div class="contact">
      <span>{{EMAIL}}</span><span>{{PHONE}}</span><span>{{LOCATION}}</span><span>{{LINKEDIN}}</span>
    </div>
  </div>
  <div class="content">
    <div>
      <div class="summary">{{SUMMARY}}</div>
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
    </div>
    <div>
      <h2>Skills</h2>
      <div class="skill-neon">
        <!-- SKILLS_START -->
        <span>{{SKILL_NAME}}</span>
        <!-- SKILLS_END -->
      </div>
      <h2 style="margin-top:16px">Education</h2>
      <!-- EDUCATION_START -->
      <div class="entry">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <div class="meta">{{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
    </div>
  </div>
  <div class="neon-line" style="position:absolute;bottom:0;left:0;right:0"></div>
</div>
</body>
</html>
