<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Whisper Resume</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'DM Sans', sans-serif; background: linear-gradient(180deg, #faf5ff, #f0e6ff); margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #fff; overflow: hidden; }
.header { padding: 28px 36px; text-align: center; background: linear-gradient(180deg, #faf5ff, #fff); }
.header h1 { font-family: 'Playfair Display', serif; font-size: 30px; color: #4a3f6b; font-weight: 600; }
.header p { color: #9b8ec4; font-size: 12px; font-weight: 400; margin-top: 4px; letter-spacing: 1px; }
.header .contact { display: flex; justify-content: center; gap: 14px; margin-top: 10px; font-size: 10px; color: #9b8ec4; flex-wrap: wrap; }
.divider { height: 1px; margin: 0 36px; background: linear-gradient(90deg, transparent, #e8d5f5, transparent); }
.body { padding: 22px 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.section h2 { font-family: 'Playfair Display', serif; font-size: 15px; color: #4a3f6b; margin-bottom: 12px; font-weight: 600; }
.item { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #f5f0ff; }
.item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.item h3 { font-weight: 500; color: #4a3f6b; font-size: 12px; }
.item p { color: #b0a3d0; font-size: 11px; margin-top: 2px; font-weight: 300; }
.item .desc { font-size: 10px; color: #888; margin-top: 3px; line-height: 1.6; }
.soft-tag { display: inline-block; padding: 5px 14px; background: #f5f0ff; border-radius: 20px; font-size: 11px; color: #7c6cac; margin: 3px; font-weight: 500; }
.full-width { grid-column: 1 / -1; }
.summary { font-size: 11px; color: #9b8ec4; line-height: 1.7; margin-bottom: 14px; text-align: center; }
</style>
</head>
<body>
<div class="resume">
  <div class="header">
    <h1>{{NAME}}</h1>
    <p>{{ROLE}}</p>
    <div class="contact">
      <span>{{EMAIL}}</span><span>·</span><span>{{PHONE}}</span><span>·</span><span>{{LOCATION}}</span><span>·</span><span>{{LINKEDIN}}</span>
    </div>
  </div>
  <div class="divider"></div>
  <div class="body">
    <div class="section full-width">
      <p class="summary">{{SUMMARY}}</p>
    </div>
    <div class="section">
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="item">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <p>{{EXP_DATE}}</p>
        <div class="desc">{{EXP_DESC}}</div>
      </div>
      <!-- EXPERIENCE_END -->
    </div>
    <div class="section">
      <h2>Education</h2>
      <!-- EDUCATION_START -->
      <div class="item">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <p>{{EDU_YEAR}}</p>
      </div>
      <!-- EDUCATION_END -->
    </div>
    <div class="section full-width">
      <h2>Skills</h2>
      <!-- SKILLS_START -->
      <span class="soft-tag">{{SKILL_NAME}}</span>
      <!-- SKILLS_END -->
    </div>
  </div>
</div>
</body>
</html>
