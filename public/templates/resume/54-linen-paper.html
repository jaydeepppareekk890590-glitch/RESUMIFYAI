<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linen Paper Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;500;600&family=Albert+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Albert Sans', sans-serif; background: #f5f0e8; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #faf6ef; overflow: hidden; padding: 40px 44px; }
.header { margin-bottom: 24px; border-bottom: 2px solid #d4c4a0; padding-bottom: 20px; }
.header h1 { font-family: 'Crimson Pro', serif; font-size: 36px; color: #3d2b1a; font-weight: 400; letter-spacing: 2px; }
.header .role { font-size: 11px; color: #8a7060; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
.header .contact { display: flex; gap: 16px; margin-top: 10px; font-size: 10px; color: #8a7060; }
.body { display: grid; grid-template-columns: 1fr 200px; gap: 28px; }
h2 { font-family: 'Crimson Pro', serif; font-size: 16px; color: #3d2b1a; margin-bottom: 12px; font-weight: 400; letter-spacing: 1px; }
.entry { margin-bottom: 14px; }
.entry h3 { font-size: 11px; color: #3d2b1a; font-weight: 500; }
.entry .meta { font-size: 10px; color: #8a7060; margin: 2px 0; }
.entry p { font-size: 10px; color: #6b5a48; line-height: 1.7; }
.linen-skill { font-size: 10px; color: #6b5a48; padding: 4px 0; border-bottom: 1px solid #e8dcc8; display: block; margin-bottom: 3px; }
.summary { font-size: 11px; color: #6b5a48; line-height: 1.7; margin-bottom: 18px; font-style: italic; }
</style>
</head>
<body>
<div class="resume">
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="role">{{ROLE}}</div>
    <div class="contact">
      <span>{{EMAIL}}</span> · <span>{{PHONE}}</span> · <span>{{LOCATION}}</span> · <span>{{LINKEDIN}}</span>
    </div>
  </div>
  <div class="body">
    <div>
      <div class="summary">{{SUMMARY}}</div>
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
      <h2>Education</h2>
      <!-- EDUCATION_START -->
      <div class="entry">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <div class="meta">{{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
    </div>
    <div>
      <h2>Skills</h2>
      <!-- SKILLS_START -->
      <span class="linen-skill">{{SKILL_NAME}}</span>
      <!-- SKILLS_END -->
    </div>
  </div>
</div>
</body>
</html>
