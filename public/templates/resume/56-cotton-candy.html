<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotton Candy Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Quicksand', sans-serif; background: #fef5ff; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #fff; overflow: hidden; }
.header { background: linear-gradient(135deg, #ffb8d9, #c8a5ff, #8dd8ff); padding: 24px 32px; color: #fff; }
.header h1 { font-family: 'Pacifico', cursive; font-size: 32px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
.header .role { font-size: 12px; opacity: 0.9; font-weight: 600; margin-top: 4px; }
.header .contact { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.header .contact span { padding: 3px 12px; background: rgba(255,255,255,0.25); border-radius: 20px; font-size: 10px; }
.body { padding: 20px 28px; display: grid; grid-template-columns: 1fr 200px; gap: 22px; }
h2 { font-family: 'Pacifico', cursive; font-size: 16px; color: #b06fd4; margin-bottom: 12px; }
.entry { margin-bottom: 12px; padding: 10px; background: #fef5ff; border-radius: 10px; border-left: 3px solid #c8a5ff; }
.entry h3 { font-size: 11px; font-weight: 700; color: #6b3fa0; }
.entry .meta { font-size: 10px; color: #c8a5ff; margin: 2px 0; }
.entry p { font-size: 10px; color: #777; line-height: 1.6; }
.candy-skill { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 10px; font-weight: 600; margin: 3px; background: linear-gradient(135deg, #ffb8d9, #c8a5ff); color: #fff; }
.candy-skill:nth-child(2n) { background: linear-gradient(135deg, #c8a5ff, #8dd8ff); }
.candy-skill:nth-child(3n) { background: linear-gradient(135deg, #8dd8ff, #ffb8d9); }
.summary { font-size: 11px; color: #777; line-height: 1.7; margin-bottom: 16px; }
.edu-item { margin-bottom: 10px; font-size: 11px; }
.edu-item h3 { font-size: 11px; font-weight: 600; color: #6b3fa0; }
.edu-item .meta { font-size: 10px; color: #c8a5ff; }
</style>
</head>
<body>
<div class="resume">
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="role">{{ROLE}}</div>
    <div class="contact">
      <span>📧 {{EMAIL}}</span><span>📱 {{PHONE}}</span><span>📍 {{LOCATION}}</span><span>🌐 {{LINKEDIN}}</span>
    </div>
  </div>
  <div class="body">
    <div>
      <div class="summary">{{SUMMARY}}</div>
      <h2>Experience ✨</h2>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
    </div>
    <div>
      <h2>Skills 💫</h2>
      <!-- SKILLS_START -->
      <span class="candy-skill">{{SKILL_NAME}}</span>
      <!-- SKILLS_END -->
      <h2 style="margin-top:16px">School 🎓</h2>
      <!-- EDUCATION_START -->
      <div class="edu-item">
        <h3>{{EDU_DEGREE}}</h3>
        <div class="meta">{{EDU_SCHOOL}} · {{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
    </div>
  </div>
</div>
</body>
</html>
