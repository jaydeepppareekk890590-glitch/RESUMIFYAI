<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ivory Calm Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Inter', sans-serif; background: #f8f5f0; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #fdfaf6; overflow: hidden; padding: 36px 44px; }
.header { margin-bottom: 22px; }
.header h1 { font-family: 'Spectral', serif; font-size: 32px; color: #2c2418; font-weight: 400; letter-spacing: 1px; }
.header .role { font-size: 11px; color: #8a7a60; letter-spacing: 3px; text-transform: uppercase; margin-top: 5px; }
.contact-bar { display: flex; gap: 16px; margin-top: 10px; font-size: 10px; color: #8a7a60; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid #e8dcc8; }
.body { display: grid; grid-template-columns: 1fr 190px; gap: 28px; }
h2 { font-family: 'Spectral', serif; font-size: 15px; color: #2c2418; margin-bottom: 12px; font-weight: 400; }
.entry { margin-bottom: 14px; }
.entry h3 { font-size: 11px; color: #2c2418; font-weight: 500; }
.entry .meta { font-size: 10px; color: #8a7a60; margin: 2px 0; }
.entry p { font-size: 10px; color: #5a4e3c; line-height: 1.7; }
.ivory-skill { font-size: 10px; color: #5a4e3c; padding: 5px 0; border-bottom: 1px solid #e8dcc8; }
.summary { font-size: 11px; color: #5a4e3c; line-height: 1.8; margin-bottom: 18px; }
</style>
</head>
<body>
<div class="resume">
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="role">{{ROLE}}</div>
    <div class="contact-bar">
      <span>{{EMAIL}}</span><span>{{PHONE}}</span><span>{{LOCATION}}</span><span>{{LINKEDIN}}</span>
    </div>
  </div>
  <div class="body">
    <div>
      <div class="summary">{{SUMMARY}}</div>
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
      <h2>Education</h2>
      <!-- EDUCATION_START -->
      <div class="entry">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <div class="meta">{{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
    </div>
    <div>
      <h2>Skills</h2>
      <!-- SKILLS_START -->
      <div class="ivory-skill">{{SKILL_NAME}}</div>
      <!-- SKILLS_END -->
    </div>
  </div>
</div>
</body>
</html>
