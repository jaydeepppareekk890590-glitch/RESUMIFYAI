<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Ray Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Exo 2', sans-serif; background: #050a14; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #050a14; overflow: hidden; color: rgba(200,230,255,0.8); }
.xray-border { border: 1px solid rgba(100,150,200,0.15); margin: 10px; height: calc(100% - 20px); display: flex; flex-direction: column; }
.header { padding: 22px 28px; border-bottom: 1px solid rgba(100,150,200,0.1); }
.header h1 { font-family: 'Share Tech Mono', monospace; font-size: 28px; color: rgba(200,230,255,0.9); letter-spacing: 4px; text-transform: uppercase; }
.header .role { font-size: 10px; color: rgba(100,150,200,0.5); letter-spacing: 4px; text-transform: uppercase; margin-top: 5px; }
.header .contact { display: flex; gap: 14px; margin-top: 10px; font-family: 'Share Tech Mono', monospace; font-size: 9px; color: rgba(100,150,200,0.35); flex-wrap: wrap; }
.body-xray { display: grid; grid-template-columns: 1fr 200px; gap: 20px; padding: 20px 28px; flex: 1; }
h2 { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: rgba(100,150,200,0.5); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 12px; }
.entry { margin-bottom: 13px; padding-left: 12px; border-left: 1px solid rgba(100,150,200,0.1); }
.entry h3 { font-size: 11px; color: rgba(200,230,255,0.8); font-weight: 500; }
.entry .meta { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: rgba(100,150,200,0.4); margin: 2px 0; }
.entry p { font-size: 10px; color: rgba(200,230,255,0.4); line-height: 1.7; }
.scan-skill { display: block; font-family: 'Share Tech Mono', monospace; font-size: 10px; color: rgba(100,200,255,0.5); padding: 4px 0; border-bottom: 1px solid rgba(100,150,200,0.05); }
.summary { font-size: 10px; color: rgba(200,230,255,0.4); line-height: 1.7; margin-bottom: 16px; font-style: italic; }
</style>
</head>
<body>
<div class="resume">
  <div class="xray-border">
    <div class="header">
      <h1>{{NAME}}</h1>
      <div class="role">{{ROLE}}</div>
      <div class="contact">
        <span>{{EMAIL}}</span><span>{{PHONE}}</span><span>{{LOCATION}}</span><span>{{LINKEDIN}}</span>
      </div>
    </div>
    <div class="body-xray">
      <div>
        <div class="summary">{{SUMMARY}}</div>
        <h2>Experience</h2>
        <!-- EXPERIENCE_START -->
        <div class="entry">
          <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
          <div class="meta">{{EXP_DATE}}</div>
          <p>{{EXP_DESC}}</p>
        </div>
        <!-- EXPERIENCE_END -->
        <h2>Education</h2>
        <!-- EDUCATION_START -->
        <div class="entry">
          <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
          <div class="meta">{{EDU_YEAR}}</div>
        </div>
        <!-- EDUCATION_END -->
      </div>
      <div>
        <h2>Skills</h2>
        <!-- SKILLS_START -->
        <span class="scan-skill">{{SKILL_NAME}}</span>
        <!-- SKILLS_END -->
      </div>
    </div>
  </div>
</div>
</body>
</html>
