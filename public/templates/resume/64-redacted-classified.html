<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redacted Classified Resume</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'IBM Plex Mono', monospace; background: #f0ece4; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #f5f0e8; overflow: hidden; padding: 28px 36px; }
.top-stamp { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 16px; border: 3px solid #cc0000; }
.stamp-label { font-size: 14px; font-weight: 700; color: #cc0000; letter-spacing: 4px; transform: rotate(-1deg); }
.file-num { font-size: 10px; color: #888; }
.header { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid #333; }
.header h1 { font-size: 24px; color: #1a1a1a; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
.header .role { font-size: 11px; color: #666; margin-top: 4px; letter-spacing: 2px; }
.header .contact { display: flex; gap: 12px; margin-top: 10px; font-size: 9px; color: #888; flex-wrap: wrap; }
.body { display: grid; grid-template-columns: 1fr 190px; gap: 24px; }
.section-label { font-size: 9px; letter-spacing: 3px; color: #888; text-transform: uppercase; border-top: 1px solid #ccc; padding-top: 8px; margin-bottom: 10px; }
.entry { margin-bottom: 13px; }
.entry h3 { font-size: 11px; font-weight: 700; color: #1a1a1a; }
.entry .meta { font-size: 9px; color: #888; margin: 2px 0; }
.entry p { font-size: 10px; color: #555; line-height: 1.7; }
.classified-skill { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid #e0d8c8; font-size: 10px; color: #444; }
.classified-skill::before { content: '▪'; color: #cc0000; }
.summary { font-size: 11px; color: #555; line-height: 1.7; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="resume">
  <div class="top-stamp">
    <div class="stamp-label">CLASSIFIED</div>
    <div class="file-num">FILE NO. CV-{{NAME}}</div>
  </div>
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="role">{{ROLE}}</div>
    <div class="contact">
      <span>{{EMAIL}}</span><span>|</span><span>{{PHONE}}</span><span>|</span><span>{{LOCATION}}</span><span>|</span><span>{{LINKEDIN}}</span>
    </div>
  </div>
  <div class="body">
    <div>
      <div class="summary">{{SUMMARY}}</div>
      <div class="section-label">Mission History</div>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
      <div class="section-label">Training Records</div>
      <!-- EDUCATION_START -->
      <div class="entry">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <div class="meta">{{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
    </div>
    <div>
      <div class="section-label">Clearance Areas</div>
      <!-- SKILLS_START -->
      <div class="classified-skill">{{SKILL_NAME}}</div>
      <!-- SKILLS_END -->
    </div>
  </div>
</div>
</body>
</html>
