<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acid Burn Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Barlow:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Barlow', sans-serif; background: #050508; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #0a0a10; overflow: hidden; color: #ccc; }
.acid-header { background: #0d1a0a; padding: 24px 32px; border-bottom: 2px solid #39ff14; }
.acid-header h1 { font-family: 'Audiowide', sans-serif; font-size: 26px; color: #39ff14; text-shadow: 0 0 12px rgba(57,255,20,0.3); letter-spacing: 2px; }
.acid-header .role { font-size: 11px; color: rgba(57,255,20,0.4); letter-spacing: 4px; text-transform: uppercase; margin-top: 4px; }
.acid-header .contact { display: flex; gap: 12px; margin-top: 10px; font-size: 10px; color: rgba(57,255,20,0.25); flex-wrap: wrap; }
.body { display: grid; grid-template-columns: 1fr 200px; padding: 20px 32px; gap: 22px; }
h2 { font-family: 'Audiowide', sans-serif; font-size: 10px; color: #39ff14; letter-spacing: 3px; margin-bottom: 12px; opacity: 0.8; }
.entry { margin-bottom: 13px; border-left: 2px solid rgba(57,255,20,0.1); padding-left: 12px; }
.entry h3 { font-size: 11px; color: rgba(255,255,255,0.85); font-weight: 600; }
.entry .meta { font-size: 9px; color: rgba(57,255,20,0.5); margin: 2px 0; letter-spacing: 2px; }
.entry p { font-size: 10px; color: rgba(200,200,200,0.4); line-height: 1.7; }
.acid-skill { display: block; font-size: 10px; color: rgba(57,255,20,0.6); padding: 5px 0; border-bottom: 1px solid rgba(57,255,20,0.05); }
.acid-skill::before { content: '◈ '; }
.summary { font-size: 10px; color: rgba(200,200,200,0.4); line-height: 1.7; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="resume">
  <div class="acid-header">
    <h1>{{NAME}}</h1>
    <div class="role">{{ROLE}}</div>
    <div class="contact">
      <span>{{EMAIL}}</span><span>{{PHONE}}</span><span>{{LOCATION}}</span><span>{{LINKEDIN}}</span>
    </div>
  </div>
  <div class="body">
    <div>
      <div class="summary">{{SUMMARY}}</div>
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
      <h2>Education</h2>
      <!-- EDUCATION_START -->
      <div class="entry">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <div class="meta">{{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
    </div>
    <div>
      <h2>Skills</h2>
      <!-- SKILLS_START -->
      <span class="acid-skill">{{SKILL_NAME}}</span>
      <!-- SKILLS_END -->
    </div>
  </div>
</div>
</body>
</html>
