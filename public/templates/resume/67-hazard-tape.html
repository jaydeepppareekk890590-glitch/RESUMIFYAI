<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hazard Tape Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Barlow Condensed', sans-serif; background: #111; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #111; overflow: hidden; }
.hazard-stripe { height: 16px; background: repeating-linear-gradient(-45deg, #ffcc00 0, #ffcc00 14px, #111 14px, #111 28px); }
.header { padding: 20px 28px; background: #1a1a1a; }
.header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: #ffcc00; letter-spacing: 3px; line-height: 1; }
.header .role { font-size: 13px; color: rgba(255,204,0,0.5); letter-spacing: 4px; margin-top: 3px; text-transform: uppercase; }
.header .contact { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: #888; flex-wrap: wrap; }
.body { padding: 18px 28px; display: grid; grid-template-columns: 1fr 200px; gap: 22px; }
h2 { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: #ffcc00; letter-spacing: 3px; margin-bottom: 12px; }
.entry { margin-bottom: 13px; padding-left: 12px; border-left: 3px solid #ffcc0040; }
.entry h3 { font-size: 12px; font-weight: 700; color: #ddd; text-transform: uppercase; letter-spacing: 1px; }
.entry .meta { font-size: 11px; color: #ffcc0066; margin: 2px 0; letter-spacing: 1px; }
.entry p { font-size: 11px; color: #666; line-height: 1.6; }
.hazard-skill { display: block; font-size: 11px; color: #aaa; padding: 5px 0; border-bottom: 1px solid #222; letter-spacing: 1px; }
.hazard-skill::before { content: '⚠ '; color: #ffcc00; font-size: 9px; }
.summary { font-size: 11px; color: #666; line-height: 1.6; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="resume">
  <div class="hazard-stripe"></div>
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="role">{{ROLE}}</div>
    <div class="contact">
      <span>{{EMAIL}}</span><span>{{PHONE}}</span><span>{{LOCATION}}</span><span>{{LINKEDIN}}</span>
    </div>
  </div>
  <div class="hazard-stripe"></div>
  <div class="body">
    <div>
      <div class="summary">{{SUMMARY}}</div>
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
    </div>
    <div>
      <h2>Skills</h2>
      <!-- SKILLS_START -->
      <span class="hazard-skill">{{SKILL_NAME}}</span>
      <!-- SKILLS_END -->
      <h2 style="margin-top:16px">Education</h2>
      <!-- EDUCATION_START -->
      <div class="entry">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <div class="meta">{{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
    </div>
  </div>
  <div class="hazard-stripe" style="position:absolute;bottom:0;left:0;right:0"></div>
</div>
</body>
</html>
