<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velvet Noir Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Montserrat', sans-serif; background: #0a0a0a; color: #d4c5a9; margin: 0; padding: 0; overflow: hidden; font-weight: 300; }
.resume { width: 210mm; height: 297mm; border: 1px solid #2a2418; background: linear-gradient(180deg, #0f0d08, #0a0a0a); overflow: hidden; }
.header { padding: 30px 40px; text-align: center; border-bottom: 1px solid #1a1810; }
.header h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: #c9a96e; font-weight: 300; letter-spacing: 6px; text-transform: uppercase; }
.header .subtitle { font-size: 10px; letter-spacing: 5px; text-transform: uppercase; color: #6a5d45; margin-top: 8px; }
.gold-line { width: 50px; height: 1px; background: linear-gradient(90deg, transparent, #c9a96e, transparent); margin: 12px auto; }
.contact { display: flex; justify-content: center; gap: 18px; font-size: 10px; color: #5a5040; letter-spacing: 1px; flex-wrap: wrap; }
.body { padding: 24px 40px; display: grid; grid-template-columns: 1fr 190px; gap: 28px; }
.section h2 { font-family: 'Cormorant Garamond', serif; font-size: 13px; color: #c9a96e; letter-spacing: 5px; text-transform: uppercase; font-weight: 400; margin-bottom: 12px; text-align: center; }
.entry { margin-bottom: 13px; text-align: center; }
.entry h3 { font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #d4c5a9; font-weight: 400; }
.entry .meta { font-size: 10px; color: #5a5040; margin: 3px 0; letter-spacing: 2px; }
.entry p { font-size: 10px; color: #8a7a60; line-height: 1.7; }
.velvet-skills { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
.vs { font-size: 10px; color: #c9a96e; letter-spacing: 2px; padding: 4px 14px; border: 1px solid #2a2418; }
.summary { font-size: 11px; color: #8a7a60; line-height: 1.7; margin-bottom: 16px; text-align: center; font-style: italic; grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="resume">
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="subtitle">{{ROLE}}</div>
    <div class="gold-line"></div>
    <div class="contact">
      <span>{{EMAIL}}</span><span>{{LOCATION}}</span><span>{{PHONE}}</span><span>{{LINKEDIN}}</span>
    </div>
  </div>
  <div class="body">
    <p class="summary">{{SUMMARY}}</p>
    <div class="section">
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
      <h2>Education</h2>
      <!-- EDUCATION_START -->
      <div class="entry">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <div class="meta">{{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
    </div>
    <div class="section">
      <h2>Expertise</h2>
      <div class="velvet-skills">
        <!-- SKILLS_START -->
        <span class="vs">{{SKILL_NAME}}</span>
        <!-- SKILLS_END -->
      </div>
    </div>
  </div>
</div>
</body>
</html>
