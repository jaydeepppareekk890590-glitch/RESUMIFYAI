<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Onyx Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Josefin+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Josefin Sans', sans-serif; background: #1a1a1a; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: #1a1a1a; overflow: hidden; display: grid; grid-template-columns: 220px 1fr; }
.sidebar { background: linear-gradient(180deg, #2a2020, #1a1618); padding: 28px 20px; border-right: 1px solid rgba(201,169,110,0.1); }
.sidebar h1 { font-family: 'Cinzel', serif; font-size: 22px; color: #c9a96e; letter-spacing: 2px; line-height: 1.2; margin-bottom: 6px; }
.sidebar .role { font-size: 9px; color: rgba(201,169,110,0.4); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; }
.sidebar h2 { font-family: 'Cinzel', serif; font-size: 11px; color: #c9a96e; letter-spacing: 3px; margin-bottom: 10px; margin-top: 18px; font-weight: 400; }
.sidebar .contact-item { font-size: 10px; color: rgba(200,180,150,0.5); margin-bottom: 5px; line-height: 1.6; word-break: break-all; }
.skill-line { font-size: 10px; color: rgba(200,180,150,0.5); padding: 4px 0; border-bottom: 1px solid rgba(201,169,110,0.05); }
.skill-line::before { content: '◆ '; color: #c9a96e; font-size: 7px; }
.main { padding: 28px 24px; overflow: hidden; }
.section { margin-bottom: 20px; }
.section h2 { font-family: 'Cinzel', serif; font-size: 12px; color: #c9a96e; letter-spacing: 4px; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid rgba(201,169,110,0.1); font-weight: 400; }
.entry { margin-bottom: 13px; }
.entry h3 { font-size: 11px; color: #d4c5aa; font-weight: 600; }
.entry .meta { font-size: 9px; color: rgba(201,169,110,0.4); margin: 2px 0; letter-spacing: 2px; }
.entry p { font-size: 10px; color: rgba(200,180,150,0.4); line-height: 1.7; }
.summary { font-size: 11px; color: rgba(200,180,150,0.4); line-height: 1.7; margin-bottom: 16px; font-style: italic; }
</style>
</head>
<body>
<div class="resume">
  <div class="sidebar">
    <h1>{{NAME}}</h1>
    <div class="role">{{ROLE}}</div>
    <h2>Contact</h2>
    <div class="contact-item">{{EMAIL}}</div>
    <div class="contact-item">{{PHONE}}</div>
    <div class="contact-item">{{LOCATION}}</div>
    <div class="contact-item">{{LINKEDIN}}</div>
    <h2>Skills</h2>
    <!-- SKILLS_START -->
    <div class="skill-line">{{SKILL_NAME}}</div>
    <!-- SKILLS_END -->
    <h2>Education</h2>
    <!-- EDUCATION_START -->
    <div class="contact-item">{{EDU_DEGREE}}<br>{{EDU_SCHOOL}} ({{EDU_YEAR}})</div>
    <!-- EDUCATION_END -->
  </div>
  <div class="main">
    <div class="summary">{{SUMMARY}}</div>
    <div class="section">
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
    </div>
  </div>
</div>
</body>
</html>
