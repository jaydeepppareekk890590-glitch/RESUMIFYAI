<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pearl Shimmer Resume</title>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Montserrat', sans-serif; background: #f5f5f8; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: linear-gradient(160deg, #fafbff, #f5f5f8); overflow: hidden; }
.pearl-top { height: 5px; background: linear-gradient(90deg, #c8c8e0, #f0f0ff, #e8e8f8, #c8c8e0); }
.header { padding: 26px 36px; text-align: center; border-bottom: 1px solid rgba(180,180,220,0.2); }
.header h1 { font-family: 'GFS Didot', serif; font-size: 32px; color: #2a2840; letter-spacing: 4px; }
.header .role { font-size: 10px; color: rgba(100,100,160,0.6); letter-spacing: 5px; text-transform: uppercase; margin-top: 5px; }
.header .contact { display: flex; justify-content: center; gap: 14px; margin-top: 10px; font-size: 10px; color: rgba(100,100,160,0.4); flex-wrap: wrap; }
.body { padding: 22px 36px; display: grid; grid-template-columns: 1fr 195px; gap: 24px; }
h2 { font-family: 'GFS Didot', serif; font-size: 16px; color: #2a2840; margin-bottom: 12px; font-weight: 400; letter-spacing: 2px; }
.entry { margin-bottom: 13px; }
.entry h3 { font-size: 11px; color: #2a2840; font-weight: 600; }
.entry .meta { font-size: 10px; color: rgba(100,100,160,0.5); margin: 2px 0; }
.entry p { font-size: 10px; color: #666; line-height: 1.7; }
.pearl-skill { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(180,180,220,0.15); font-size: 10px; color: #555; }
.pearl-skill::before { content: '◉'; color: rgba(100,100,160,0.35); font-size: 8px; }
.summary { font-size: 11px; color: #666; line-height: 1.7; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="resume">
  <div class="pearl-top"></div>
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="role">{{ROLE}}</div>
    <div class="contact">
      <span>{{EMAIL}}</span><span>·</span><span>{{PHONE}}</span><span>·</span><span>{{LOCATION}}</span><span>·</span><span>{{LINKEDIN}}</span>
    </div>
  </div>
  <div class="body">
    <div>
      <div class="summary">{{SUMMARY}}</div>
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
      <h2>Education</h2>
      <!-- EDUCATION_START -->
      <div class="entry">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <div class="meta">{{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
    </div>
    <div>
      <h2>Skills</h2>
      <!-- SKILLS_START -->
      <div class="pearl-skill">{{SKILL_NAME}}</div>
      <!-- SKILLS_END -->
    </div>
  </div>
  <div class="pearl-top" style="position:absolute;bottom:0;left:0;right:0"></div>
</div>
</body>
</html>
