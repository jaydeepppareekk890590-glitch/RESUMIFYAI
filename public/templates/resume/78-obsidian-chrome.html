<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obsidian Chrome Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { font-family: 'Exo 2', sans-serif; background: #050508; margin: 0; padding: 0; overflow: hidden; }
.resume { width: 210mm; height: 297mm; background: linear-gradient(160deg, #0a0a10, #050508); overflow: hidden; color: #9090b0; }
.chrome-bar { height: 4px; background: linear-gradient(90deg, #444, #ccc, #888, #ccc, #444); }
.header { padding: 24px 32px; border-bottom: 1px solid rgba(150,150,200,0.08); }
.header h1 { font-family: 'Orbitron', sans-serif; font-size: 26px; color: #c0c0d8; font-weight: 700; letter-spacing: 3px; }
.header .role { font-size: 10px; color: rgba(150,150,200,0.4); letter-spacing: 5px; text-transform: uppercase; margin-top: 4px; font-family: 'Orbitron', sans-serif; }
.header .contact { display: flex; gap: 14px; margin-top: 10px; font-size: 10px; color: rgba(150,150,200,0.3); flex-wrap: wrap; }
.body { padding: 20px 32px; display: grid; grid-template-columns: 1fr 200px; gap: 24px; }
h2 { font-family: 'Orbitron', sans-serif; font-size: 10px; color: rgba(150,150,200,0.5); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 12px; }
.entry { margin-bottom: 13px; padding-left: 12px; border-left: 1px solid rgba(150,150,200,0.08); }
.entry h3 { font-size: 11px; color: #c0c0d8; font-weight: 600; }
.entry .meta { font-size: 9px; color: rgba(150,150,200,0.35); margin: 2px 0; letter-spacing: 2px; }
.entry p { font-size: 10px; color: rgba(150,150,200,0.3); line-height: 1.7; }
.chrome-skill { display: block; font-size: 10px; color: rgba(150,150,200,0.5); padding: 4px 0; border-bottom: 1px solid rgba(150,150,200,0.05); }
.chrome-skill::before { content: '» '; color: rgba(180,180,220,0.4); }
.summary { font-size: 10px; color: rgba(150,150,200,0.3); line-height: 1.7; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="resume">
  <div class="chrome-bar"></div>
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="role">{{ROLE}}</div>
    <div class="contact">
      <span>{{EMAIL}}</span><span>{{PHONE}}</span><span>{{LOCATION}}</span><span>{{LINKEDIN}}</span>
    </div>
  </div>
  <div class="body">
    <div>
      <div class="summary">{{SUMMARY}}</div>
      <h2>Experience</h2>
      <!-- EXPERIENCE_START -->
      <div class="entry">
        <h3>{{EXP_TITLE}} — {{EXP_COMPANY}}</h3>
        <div class="meta">{{EXP_DATE}}</div>
        <p>{{EXP_DESC}}</p>
      </div>
      <!-- EXPERIENCE_END -->
      <h2>Education</h2>
      <!-- EDUCATION_START -->
      <div class="entry">
        <h3>{{EDU_DEGREE}} — {{EDU_SCHOOL}}</h3>
        <div class="meta">{{EDU_YEAR}}</div>
      </div>
      <!-- EDUCATION_END -->
    </div>
    <div>
      <h2>Skills</h2>
      <!-- SKILLS_START -->
      <span class="chrome-skill">{{SKILL_NAME}}</span>
      <!-- SKILLS_END -->
    </div>
  </div>
  <div class="chrome-bar" style="position:absolute;bottom:0;left:0;right:0"></div>
</div>
</body>
</html>
